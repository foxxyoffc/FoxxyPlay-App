<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 420 510">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset=".45" stop-color="#D9A441"/>
      <stop offset=".75" stop-color="#F2C875"/>
      <stop offset="1" stop-color="#9B702B"/>
    </linearGradient>

    <linearGradient id="shine">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="reveal">
      <rect x="0" y="0" width="420" height="420">
        <animate attributeName="width"
          values="0;420;420;0"
          keyTimes="0;.58;.88;1"
          dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="510" fill="#090A0B"/>

  <!-- Animated outer frame -->
  <rect x="28" y="18" width="364" height="364"
        rx="54" fill="none"
        stroke="#39332A" stroke-width="1.5"/>

  <rect x="28" y="18" width="364" height="364"
        rx="54" fill="none"
        stroke="url(#gold)" stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="1456"
        stroke-dashoffset="1456"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
      values="1456;0;0;1456"
      keyTimes="0;.55;.85;1"
      dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Original FoxxyPlay logo -->
  <g clip-path="url(#reveal)">
    <image x="28" y="18" width="364" height="364"
           xlink:href="foxxyplay_logo.png"
           preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Light sweep across logo -->
  <path d="M-100 340 L180 -20 L250 -20 L-30 340Z"
        fill="url(#shine)" opacity="0.0">
    <animateTransform attributeName="transform"
      type="translate"
      values="-100 0;550 0"
      dur="2.8s" begin="1.7s"
      repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;.55;0"
      dur="2.8s" begin="1.7s"
      repeatCount="indefinite"/>
  </path>

  <!-- Small light particles -->
  <g fill="#F2C875" filter="url(#glow)">
    <circle cx="65" cy="100" r="2">
      <animate attributeName="opacity"
        values=".1;1;.1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="275" r="2">
      <animate attributeName="opacity"
        values="1;.1;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="65" r="1.5">
      <animate attributeName="opacity"
        values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FOXXYPLAY title -->
  <text x="210" y="435"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="29"
        font-weight="700"
        letter-spacing="7"
        fill="#F3F0E9"
        opacity="0">
    FOXXYPLAY
    <animate attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;.4;.7;1"
      dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- Gold text glow -->
  <text x="210" y="435"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="29"
        font-weight="700"
        letter-spacing="7"
        fill="url(#gold)"
        opacity=".4"
        filter="url(#glow)">
    FOXXYPLAY
    <animate attributeName="opacity"
      values=".1;.7;.1"
      dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative underline -->
  <rect x="115" y="453" width="190" height="1.5"
        rx="1" fill="url(#gold)">
    <animate attributeName="opacity"
      values=".2;1;.2"
      dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Loading indicator -->
  <text x="210" y="482"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="10"
        letter-spacing="4"
        fill="#9B9A96">
    INITIALIZING
    <animate attributeName="opacity"
      values=".35;1;.35"
      dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>
