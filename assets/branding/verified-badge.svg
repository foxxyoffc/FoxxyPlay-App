<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42B8FF"/>
      <stop offset="55%" stop-color="#1689F9"/>
      <stop offset="100%" stop-color="#0864D8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M24 2 L28 5 L33 4 L36 9 L41 11 L40 17
    L45 21 L43 26 L45 31 L40 35 L39 41 L33 42
    L29 46 L24 43 L19 46 L15 42 L9 41 L8 35
    L3 31 L5 26 L3 21 L8 17 L7 11 L13 9 L16 4
    L21 5 Z"
    fill="url(#blue)" filter="url(#glow)">
    <animate attributeName="opacity"
      values="1;.88;1" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <path d="M14 24 L21 31 L34 17"
    fill="none" stroke="#FFFFFF" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="30" stroke-dashoffset="30">
    <animate attributeName="stroke-dashoffset"
      from="30" to="0" dur=".65s" fill="freeze"/>
  </path>
</svg>
